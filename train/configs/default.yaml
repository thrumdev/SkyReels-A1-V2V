# Default config for SkyReels-A1 training pipeline
# All keys and defaults are inferred from train/train.py, train/dataloader.py, train/pipeline.py

wandb_enabled: true
wandb_project: skyreels-a1-v2v
wandb_name: null
#lora_rank: 128 
#use_rslora: true
learning_rate: 1e-5
num_steps: 20000
save_frequency: 1000
save_dir: checkpoints
val_save_dir: denoised
batch_size: 4
data_dir: "data/train"
model_path: pretrained_models/SkyReels-A1-5B
siglip_path: pretrained_models/SkyReels-A1-5B/siglip-so400m-patch14-384
dtype: bfloat16
delta_loss_lambda: 0.333
max_mask_expand: 10
validation_steps: 1000
validation_data_dir: 'data/val'
max_checkpoints: 5
dataloader_workers: 5
gradient_checkpointing: true
gradient_accumulation_steps: 4
compile: false
logit_normal_blend: 0.6
#restore_checkpoint: /path/to/checkpoint
#start_step: 0
explicit_mask_channels: False
# inference_name: mp4_name
# inference_only: true
clamp_timestep_weight: 2.5
max_ref_dropout_frames: 20
